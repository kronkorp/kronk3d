name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.compiler }} (${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsfml-dev libgl-dev xvfb libgl1-mesa-dri

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build build --parallel

      # Mesa's software OpenGL (llvmpipe) on a virtual display: the OpenGL tests must run, not skip.
      - name: Test
        env:
          K3_REQUIRE_GL: 1
          LIBGL_ALWAYS_SOFTWARE: 1
        run: xvfb-run -a ctest --test-dir build --output-on-failure

      - name: Run the example on both backends
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          xvfb-run -a ./build/bin/kronk3d_example --backend software --scene 4 --screenshot software.png
          xvfb-run -a ./build/bin/kronk3d_example --backend opengl --scene 4 --screenshot opengl.png

      # Another project consuming the installed package through find_package(kronk3d).
      - name: Install and consume the package
        if: matrix.build_type == 'Release'
        run: |
          cmake --install build --prefix "$PWD/install"
          for link in static shared; do
            cmake -S modules/test/package -B consumer-$link -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCMAKE_PREFIX_PATH="$PWD/install" -DK3_LINK=$link
            cmake --build consumer-$link
            LD_LIBRARY_PATH="$PWD/install/lib" ./consumer-$link/kronk3d_consumer
          done

  windows-msvc:
    name: Windows MSVC (${{ matrix.build_type }})
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Install and consume the package
        if: matrix.build_type == 'Release'
        run: |
          cmake --install build --config Release --prefix "$PWD/install"
          cmake -S modules/test/package -B consumer -A x64 -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build consumer --config Release
          ./consumer/Release/kronk3d_consumer.exe

  windows-mingw:
    name: Windows MinGW (Release)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - uses: actions/checkout@v4

      # MSYS2 ships SFML 3, so the build falls back to SFML 2.6 from source (window module only).
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
